<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>种菜沙盒</title>
		<style>
/* 自定义加载页（③-2 B）。**不许引外部 CDN**：断网 / 内网都要能显示，所以字体只用系统栈、
   图标只用 CSS 画；进度**只来自 Godot 的下载回调**（`engine.startGame({onProgress})`），
   拿不到总大小时就只说「正在加载」，不编一个百分比出来。 */
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #e8e6e1;
	background-color: #0e1116;
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#loading {
	position: fixed;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: #242424;
	z-index: 10;
}

#loading.gone {
	display: none;
}

.panel {
	width: min(88vw, 460px);
	text-align: center;
}

#splash {
	max-width: 96px;
	max-height: 96px;
	margin-bottom: 18px;
}

#splash.show-image--false {
	display: none;
}

h1 {
	font-size: 22px;
	font-weight: 600;
	margin: 0 0 6px 0;
}

#tip {
	font-size: 15px;
	color: #b9c2cc;
	margin: 0 0 14px 0;
}

#bar {
	width: 100%;
	height: 8px;
	border-radius: 4px;
	background-color: #232a33;
	overflow: hidden;
}

#fill {
	width: 0%;
	height: 100%;
	border-radius: 4px;
	background-color: #6fbf73;
	transition: width 0.15s linear;
}

/* 拿不到总大小：不编百分比，只用一条来回滑的亮带表示「还在下」。 */
#bar.unknown #fill {
	width: 30%;
	animation: slide 1.2s linear infinite;
}

@keyframes slide {
	from { transform: translateX(-110%); }
	to { transform: translateX(340%); }
}

#start {
	margin-top: 18px;
	padding: 12px 34px;
	font-size: 17px;
	font-family: inherit;
	color: #10151b;
	background-color: #6fbf73;
	border: 0;
	border-radius: 8px;
	cursor: pointer;
}

#start:hover {
	background-color: #82cc86;
}

#start[hidden] {
	display: none;
}

small {
	display: block;
	margin-top: 16px;
	font-size: 13px;
	line-height: 1.55;
	color: #8d97a3;
}

#notice {
	display: none;
	margin-top: 16px;
	padding: 12px 14px;
	font-size: 13px;
	line-height: 1.5;
	text-align: left;
	color: #ffd9cf;
	background-color: #4a2b2b;
	border: 1px solid #8a4747;
	border-radius: 8px;
	white-space: pre-wrap;
}

#notice.show {
	display: block;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			你的浏览器不支持 canvas 标签。
		</canvas>

		<noscript>
			你的浏览器没有开启 JavaScript，游戏跑不起来。
		</noscript>

		<div id="loading">
			<div class="panel">
				<img id="splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
				<h1>种菜沙盒</h1>
				<div id="tip">正在加载…</div>
				<div id="bar"><div id="fill"></div></div>
				<button id="start" hidden>开始</button>
				<small>
					第一次打开要下载引擎和资源包，之后浏览器会缓存。<br>
					进度条走完之后还要生成一次世界，本机会停顿 1～2 分钟，请不要关掉页面。
				</small>
				<div id="notice"></div>
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":65221536,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loading = document.getElementById('loading');
	const bar = document.getElementById('bar');
	const fill = document.getElementById('fill');
	const tip = document.getElementById('tip');
	const startButton = document.getElementById('start');
	const notice = document.getElementById('notice');
	const canvas = document.getElementById('canvas');

	function showNotice(text) {
		notice.textContent = text;
		notice.classList.add('show');
	}

	function setLoaded() {
		bar.classList.remove('unknown');
		fill.style.width = '100%';
		tip.textContent = '加载完成，点下面的按钮开始';
		startButton.hidden = false;
		startButton.focus();
	}

	function onProgress(current, total) {
		if (current > 0 && total > 0) {
			const ratio = Math.min(1, current / total);
			bar.classList.remove('unknown');
			fill.style.width = (ratio * 100).toFixed(1) + '%';
			tip.textContent = '正在加载 ' + Math.floor(ratio * 100) + '%';
			return;
		}
		// 拿不到总大小（有些服务器不给 Content-Length）：只说在加载，**不编百分比**。
		bar.classList.add('unknown');
		tip.textContent = '正在加载…';
	}

	startButton.addEventListener('click', function () {
		loading.classList.add('gone');
		canvas.focus();
	});

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		const message = '启动失败\n这个浏览器缺少运行本游戏需要的功能：\n' + missing.join('\n') +
			'\n换一个较新的 Chrome / Edge / Firefox / Safari 再试。';
		tip.textContent = '启动失败';
		showNotice(message);
		return;
	}

	engine.startGame({
		'onProgress': onProgress,
	}).then(setLoaded, function (err) {
		console.error(err);
		tip.textContent = '启动失败';
		showNotice('启动失败\n' + (err instanceof Error ? err.message : String(err)) +
			'\n刷新页面重试；还是不行就换一个浏览器。');
	});
}());
		</script>
	</body>
</html>
